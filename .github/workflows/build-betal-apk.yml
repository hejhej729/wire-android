name: Build Betal APK

on:
  workflow_dispatch:
    inputs:
      expiry_minutes:
        description: "Minutes until this build expires (43200 = 30 days). Use a small number only for testing."
        default: "43200"
  push:
    branches: [ betalversion ]
  schedule:
    # Twice a week: keeps the signing keys in GitHub's cache alive (they are deleted after 7 days unused).
    - cron: "17 5 * * 1,4"

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Touch the betal signing key cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.betal-keys
          key: betal-signing-key-v1
      - name: Ask the personal build to touch its signing key cache too
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-broadcast-apk.yml --ref broadcast-apk -f keepalive=true -R "$GITHUB_REPOSITORY" || true

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BROADCAST_APP_ID_SUFFIX: ".betal"
      BROADCAST_APP_NAME: "Utskick Betal"
      BROADCAST_EXPIRY_MINUTES: ${{ github.event.inputs.expiry_minutes || '43200' }}
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/*-rc* || true

      - name: Checkout (with kalium submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key (created on first run, reused afterwards)
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/.betal-keys
          key: betal-signing-key-v1

      - name: Create signing key if none exists yet
        if: steps.keycache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.betal-keys
          PW=$(openssl rand -hex 24)
          echo -n "$PW" > ~/.betal-keys/password.txt
          keytool -genkeypair -keystore ~/.betal-keys/betal.p12 -storetype PKCS12 \
            -alias betal -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=Utskick Betal"

      - name: Build release APK (alpha flavor, optimized, with expiry)
        run: |
          export KEYSTORE_PWD="$(cat ~/.betal-keys/password.txt)"
          export ENABLE_SIGNING=TRUE
          for t in RELEASE DEBUG COMPAT COMPAT_RELEASE; do
            export "KEYSTORE_FILE_PATH_$t=$HOME/.betal-keys/betal.p12"
            export "KEYSTOREPWD_$t=$KEYSTORE_PWD"
            export "KEYSTORE_KEY_NAME_$t=betal"
            export "KEYPWD_$t=$KEYSTORE_PWD"
          done
          ./gradlew assembleAlphaRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/utskick-betal.apk \;
          ls -la out

      - name: Publish APK as a release (new link for every build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$BROADCAST_EXPIRY_MINUTES" = "43200" ]; then
            TAG="betal-$(date -u +%Y%m%d-%H%M)"
            NOTES="Betal build. Expires 30 days after $(date -u '+%Y-%m-%d %H:%M UTC')."
          else
            TAG="betal-test"
            NOTES="TEST build, expires after $BROADCAST_EXPIRY_MINUTES minutes from $(date -u '+%H:%M UTC')."
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi
          gh release create "$TAG" out/utskick-betal.apk \
            --title "Utskick Betal ($TAG)" --notes "$NOTES" \
            --target "${GITHUB_SHA}" --latest=false
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
