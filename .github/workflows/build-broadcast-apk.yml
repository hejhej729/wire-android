name: Build Broadcast APK

on:
  workflow_dispatch:
  push:
    branches: [ broadcast-apk ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/*-rc* || true
          df -h /

      - name: Checkout (with kalium submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (alpha flavor, production backend)
        run: ./gradlew assembleAlphaDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wire-broadcast-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish APK as a release (direct download, no zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/*.apk wire-broadcast.apk
          gh release delete broadcast-latest --yes --cleanup-tag || true
          gh release create broadcast-latest wire-broadcast.apk \
            --title "Wire Broadcast APK" \
            --notes "Dev debug build with the Broadcast screen." \
            --target "${GITHUB_SHA}"
